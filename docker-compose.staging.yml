version: '3.8'

# ============================================================================
# Docker Compose für Staging-Umgebung
# ============================================================================
# Diese Datei wird für das automatische Deployment in die Staging-Umgebung
# verwendet. Sie enthält alle Services: Backend, Frontend und Datenbank.
# ============================================================================

services:
  # ========================================================================
  # PostgreSQL Datenbank
  # ========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: ipa-postgres-staging
    environment:
      POSTGRES_DB: ${STAGING_DB_NAME:-ipa_kriterien_db}
      POSTGRES_USER: ${STAGING_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:-postgres}
    ports:
      - "${STAGING_DB_PORT:-5432}:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ipa-staging-network
    restart: unless-stopped

  # ========================================================================
  # Backend (Spring Boot)
  # ========================================================================
  backend:
    image: ipa-backend:latest
    container_name: ipa-backend-staging
    environment:
      # Datenbank-Konfiguration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${STAGING_DB_NAME:-ipa_kriterien_db}
      SPRING_DATASOURCE_USERNAME: ${STAGING_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${STAGING_DB_PASSWORD:-postgres}
      # JPA-Konfiguration
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      # CORS-Konfiguration (Frontend URL)
      SPRING_WEB_CORS_ALLOWED_ORIGINS: ${STAGING_FRONTEND_URL:-http://localhost:80}
      # Server-Port
      SERVER_PORT: 8080
    ports:
      - "${STAGING_BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ipa-staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/criteria"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  # ========================================================================
  # Frontend (React + Nginx)
  # ========================================================================
  frontend:
    image: ipa-frontend:latest
    container_name: ipa-frontend-staging
    environment:
      # API URL (Backend)
      VITE_API_URL: ${STAGING_API_URL:-http://localhost:8080/api}
    ports:
      - "${STAGING_FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ipa-staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

# ========================================================================
# Netzwerk
# ========================================================================
networks:
  ipa-staging-network:
    driver: bridge

# ========================================================================
# Volumes
# ========================================================================
volumes:
  postgres_staging_data:
    driver: local
