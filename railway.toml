# Railway Konfiguration für IPA-Kriterien-App
# Dieses Projekt besteht aus 3 Services: PostgreSQL, Backend, Frontend

[build]
# Railway erkennt automatisch die Dockerfiles

[deploy]
# Healthcheck für Backend
healthcheckPath = "/api/criteria"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
