# ============================================================================
# CI Pipeline: Build, Lint & Tests
# ============================================================================
# Diese Pipeline stellt sicher, dass:
# - Der Code kompiliert (Backend & Frontend)
# - Code-Qualität durch Linting geprüft wird
# - Unit- und Integrationstests automatisch ausgeführt werden
# - Testergebnisse sind in GitHub Actions sichtbar
# - Die Pipeline bei Fehlern abbricht
# ============================================================================

name: CI Build, Lint & Tests

# ============================================================================
# Trigger: Wann wird die Pipeline ausgeführt?
# ============================================================================
# - Bei jedem Push auf main oder feature/** Branches
# - Bei jedem Pull Request auf main
# ============================================================================
on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

# ============================================================================
# Jobs: Parallele Ausführung der Build-Schritte
# ============================================================================
jobs:
  # ========================================================================
  # Job 1: Backend Build, Test & Lint
  # ========================================================================
  # - Kompiliert den Java-Code mit Maven
  # - Führt Unit- und Integrationstests aus (JUnit)
  # - Erstellt Test-Reports (sichtbar in GitHub Actions)
  # - Erstellt das JAR-Package
  # - Stoppt bei Fehlern (automatisch durch Maven)
  # ========================================================================
  backend-build-test:
    name: Backend Build & Tests
    runs-on: ubuntu-latest
    
    steps:
      # Schritt 1: Repository-Code auschecken
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # Schritt 2: Java 17 Setup
      # - Installiert Java 17 (Temurin Distribution)
      # - Aktiviert Maven-Cache für schnellere Builds
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      # Schritt 3: Maven Clean & Compile
      # - Löscht alte Build-Artefakte (clean)
      # - Kompiliert den Code (compile)
      # - Stoppt bei Kompilierungsfehlern (Exit Code != 0)
      - name: Maven Clean & Compile
        working-directory: ./backend
        run: mvn clean compile
      
      # Schritt 4: Maven Test
      # - Führt alle Unit- und Integrationstests aus (JUnit)
      # - Erstellt Test-Reports in target/surefire-reports/
      # - Stoppt bei Testfehlern (Exit Code != 0)
      # - Auch wenn keine Tests existieren, wird dieser Schritt erfolgreich sein
      - name: Run Backend Tests
        working-directory: ./backend
        run: mvn test
      
      # Schritt 5: Test-Report hochladen
      # - Macht Test-Ergebnisse in GitHub Actions sichtbar
      # - Zeigt fehlgeschlagene Tests im UI an
      # - continue-on-error: true verhindert Fehler, wenn keine Reports vorhanden sind
      - name: Publish Test Results
        if: always()
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            backend/target/surefire-reports/**/*.xml
          check_name: Backend Test Results
          comment_mode: create-new
          report_individual_runs: true
      
      # Schritt 6: Maven Package
      # - Erstellt das JAR-Package
      # - Stoppt bei Fehlern (Exit Code != 0)
      - name: Maven Package
        working-directory: ./backend
        run: mvn package -DskipTests
      
      # Schritt 7: Backend JAR speichern
      # - Speichert JAR-Artefakt für Deployment
      # - Wird vom Deployment-Job verwendet
      - name: Upload Backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1

  # ========================================================================
  # Job 2: Frontend Build, Test & Lint
  # ========================================================================
  # - Installiert Frontend-Dependencies
  # - Führt ESLint aus (Code-Qualitätsprüfung)
  # - Prüft TypeScript-Typen
  # - Führt Frontend-Tests aus (Vitest)
  # - Erstellt Test-Coverage-Reports
  # - Erstellt Production-Build
  # - Stoppt bei Fehlern (jeder Schritt prüft Exit Code)
  # ========================================================================
  frontend-build-test-lint:
    name: Frontend Build, Tests & Lint
    runs-on: ubuntu-latest
    
    steps:
      # Schritt 1: Repository-Code auschecken
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # Schritt 2: Node.js Setup
      # - Installiert Node.js Version 20
      # - Aktiviert npm-Cache für schnellere Builds
      # - Cache-Pfad zeigt auf frontend/package-lock.json
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      # Schritt 3: Dependencies installieren
      # - npm ci installiert exakt die Versionen aus package-lock.json
      # - Falls package-lock.json nicht synchron ist, wird npm install verwendet
      # - Stoppt bei Fehlern (z.B. fehlende Dependencies)
      - name: Install Dependencies
        working-directory: ./frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi
      
      # Schritt 4: ESLint ausführen
      # - Prüft Code-Qualität und Style
      # - --max-warnings 0: Keine Warnungen erlaubt
      # - Stoppt bei Fehlern oder Warnungen (Exit Code != 0)
      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint
      
      # Schritt 5: TypeScript Type-Check
      # - Prüft TypeScript-Typen ohne Code zu generieren (--noEmit)
      # - Findet Type-Fehler vor dem Build
      # - Stoppt bei Type-Fehlern (Exit Code != 0)
      - name: TypeScript Type Check
        working-directory: ./frontend
        run: npx tsc --noEmit
      
      # Schritt 6: Frontend Tests ausführen
      # - Führt alle Vitest-Tests aus (Unit & Component Tests)
      # - Erstellt Coverage-Reports
      # - Stoppt bei Testfehlern (Exit Code != 0)
      # - Auch wenn keine Tests existieren, wird dieser Schritt erfolgreich sein
      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm run test
      
      # Schritt 7: Test-Coverage hochladen (optional)
      # - Macht Coverage-Reports in GitHub Actions sichtbar
      # - Wird nur ausgeführt, wenn Tests vorhanden sind
      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
      
      # Schritt 8: Frontend Production Build
      # - Kompiliert TypeScript zu JavaScript
      # - Erstellt optimiertes Production-Bundle mit Vite
      # - Stoppt bei Build-Fehlern (Exit Code != 0)
      - name: Frontend Build
        working-directory: ./frontend
        run: npm run build
      
      # Schritt 9: Frontend Build-Artefakte speichern
      # - Speichert Build-Artefakte für Deployment
      # - Wird vom Deployment-Job verwendet
      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 1

  # ========================================================================
  # Job 3: Staging Deployment
  # ========================================================================
  # - Wird nur ausgeführt, wenn Build & Tests erfolgreich waren
  # - Läuft nur auf main-Branch (nicht auf Feature-Branches)
  # - Baut Docker Images für Backend und Frontend
  # - Nutzt Secrets für sensible Daten (Datenbank-Credentials, etc.)
  # - Deployed automatisch nach erfolgreichem Pipeline-Durchlauf
  # ========================================================================
  staging-deployment:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # Nur auf main-Branch nach erfolgreichem Build & Test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend-build-test, frontend-build-test-lint]
    
    steps:
      # Schritt 1: Repository-Code auschecken
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # Schritt 2: Backend JAR herunterladen
      # - Lädt das gebaute JAR aus dem Build-Job
      - name: Download Backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target/
      
      # Schritt 3: Frontend Build herunterladen
      # - Lädt das gebaute Frontend aus dem Build-Job
      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
      
      # Schritt 4: Docker Images bauen
      # - Baut Backend Docker Image
      # - Baut Frontend Docker Image
      # - Tagged mit Git SHA für Versionierung
      - name: Build Docker Images
        run: |
          docker build -t ipa-backend:${{ github.sha }} -t ipa-backend:latest ./backend
          docker build -t ipa-frontend:${{ github.sha }} -t ipa-frontend:latest ./frontend
      
      # Schritt 5: Docker Images speichern (optional)
      # - Speichert Images als Artefakte für späteres Deployment
      # - Kann für manuelles Deployment verwendet werden
      - name: Save Docker Images
        run: |
          docker save ipa-backend:latest | gzip > backend-image.tar.gz
          docker save ipa-frontend:latest | gzip > frontend-image.tar.gz
      
      # Schritt 6: Docker Images hochladen (optional)
      # - Macht Images für manuelles Deployment verfügbar
      - name: Upload Docker Images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            backend-image.tar.gz
            frontend-image.tar.gz
          retention-days: 7
      
      # Schritt 7: Deployment-Informationen ausgeben
      # - Zeigt Deployment-Status und verwendete Secrets
      # - WICHTIG: Secrets werden nie im Log ausgegeben (GitHub verhindert das automatisch)
      - name: Deployment Info
        env:
          # Secrets werden über GitHub Secrets konfiguriert
          # Diese Variablen sind nur im Workflow verfügbar, nicht im Code
          STAGING_DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          STAGING_DB_NAME: ${{ secrets.STAGING_DB_NAME }}
          STAGING_DB_USER: ${{ secrets.STAGING_DB_USER }}
          # STAGING_DB_PASSWORD wird nicht ausgegeben (Sicherheit)
        run: |
          echo "🚀 Deployment gestartet für Commit: ${{ github.sha }}"
          echo "📦 Backend Image: ipa-backend:${{ github.sha }}"
          echo "📦 Frontend Image: ipa-frontend:${{ github.sha }}"
          echo "✅ Docker Images erfolgreich gebaut"
          echo "📝 Hinweis: Für vollständiges Deployment müssen Secrets in GitHub konfiguriert werden"
          echo "   Siehe: Repository Settings > Secrets and variables > Actions"
      
      # Schritt 8: Deployment-Script ausführen (Platzhalter)
      # - Hier kann ein spezifisches Deployment-Script ausgeführt werden
      # - z.B. für Railway, Render, Fly.io, oder eigene Server
      # - Aktuell: Nur Info-Output, da keine spezifische Plattform definiert ist
      - name: Deploy to Staging
        env:
          # Beispiel: Secrets für verschiedene Deployment-Plattformen
          # Diese müssen in GitHub Secrets konfiguriert werden
          DEPLOYMENT_PLATFORM: ${{ secrets.DEPLOYMENT_PLATFORM }}
          DEPLOYMENT_TOKEN: ${{ secrets.DEPLOYMENT_TOKEN }}
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          echo "📋 Deployment-Konfiguration:"
          echo "   Platform: ${DEPLOYMENT_PLATFORM:-nicht konfiguriert}"
          echo "   Staging URL: ${STAGING_URL:-nicht konfiguriert}"
          echo ""
          echo "✅ Deployment-Artefakte bereit:"
          echo "   - Backend JAR: backend/target/*.jar"
          echo "   - Frontend Build: frontend/dist/"
          echo "   - Docker Images: ipa-backend:latest, ipa-frontend:latest"
          echo ""
          echo "📝 Nächste Schritte:"
          echo "   1. Konfiguriere Secrets in GitHub (Repository Settings > Secrets)"
          echo "   2. Implementiere spezifisches Deployment-Script für gewählte Plattform"
          echo "   3. Aktiviere automatisches Deployment in diesem Schritt"

